# Не даёт бесплатному Render усыпить демо-стенд: раз в 10 минут обращается к сайту.
# Замок стенда отвечает 401 без пароля — этого достаточно, чтобы сервис не засыпал (пароли не нужны и сюда не пишутся).
name: keep-demo-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -m 90 -w "%{http_code}" https://fur-erp.onrender.com/login || echo 000)
            echo "attempt $i: $code"
            if [ "$code" = "200" ] || [ "$code" = "401" ]; then exit 0; fi
            sleep 20
          done
          exit 1
