name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fur_erp:fur_erp@127.0.0.1:5432/fur_erp
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      ALLOW_REGISTRATION: "false"

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Lint src
        run: npx eslint src --quiet
      - name: Production build
        run: npm run build

  # Все scripts/test-*.ts на заготовке: обезличенная база демо из репозитория (deploy/demo/demo.sql.gz) + витрина, собранная
  # текущим кодом. Живая база и файлы владельца не нужны; каждый тест идёт на своей копии заготовки (scripts/run-all-tests.sh).
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fur_erp
          POSTGRES_PASSWORD: fur_erp
          POSTGRES_DB: fur_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fur_erp" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://fur_erp:fur_erp@127.0.0.1:5432/fur_erp
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      ALLOW_REGISTRATION: "false"
      FIXTURE: demo
      DB_CONTAINER: none
      PGHOST: 127.0.0.1
      DB_HOST_PORT: "5432"
      DB_USER: fur_erp
      DB_PASSWORD: fur_erp
      TEST_TIMEOUT: "600"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Клиент PostgreSQL 16
        run: sudo apt-get install -y -q postgresql-client-16 || sudo apt-get install -y -q postgresql-client
      - name: S3-совместимый сервер для проверки хранилища (scripts/test-storage.ts)
        # Versity Gateway проверяет подпись запросов, как Yandex Object Storage; образы MinIO больше не публикуются открыто.
        run: |
          docker run -d --name s3 -p 127.0.0.1:19000:7070 versity/versitygw:latest --access minioadmin --secret minioadmin --region us-east-1 posix /tmp
          for i in $(seq 1 60); do curl -s -o /dev/null http://127.0.0.1:19000/ && break; sleep 1; done
      - name: Тесты на заготовке
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:19000
        run: bash scripts/run-all-tests.sh

  # Сквозная проверка собранного сервера на заготовке: все страницы разделов у владельца без ошибки рендера (test-smoke)
  # и периметр ролей, заголовки, вход (test-security). scripts/smoke-run.sh сам поднимает базу и `next start`.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fur_erp
          POSTGRES_PASSWORD: fur_erp
          POSTGRES_DB: fur_erp
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fur_erp" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://fur_erp:fur_erp@127.0.0.1:5432/fur_erp
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      ALLOW_REGISTRATION: "false"
      DB_CONTAINER: none
      PGHOST: 127.0.0.1
      DB_HOST_PORT: "5432"
      DB_USER: fur_erp
      DB_PASSWORD: fur_erp
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - name: Клиент PostgreSQL 16
        run: sudo apt-get install -y -q postgresql-client-16 || sudo apt-get install -y -q postgresql-client
      - name: Production build
        run: npm run build
      - name: Сквозная проверка на заготовке
        run: bash scripts/smoke-run.sh
