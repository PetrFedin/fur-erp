name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://fur_erp:fur_erp@127.0.0.1:5432/fur_erp
      AUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_SECRET: ci-only-not-a-production-secret
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      ALLOW_REGISTRATION: "false"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run build
