services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: fur_erp
      POSTGRES_PASSWORD: fur_erp
      POSTGRES_DB: fur_erp
    ports:
      - "5436:5432"
    volumes:
      - fur_erp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fur_erp -d fur_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://fur_erp:fur_erp@db:5432/fur_erp
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  fur_erp_db_data:
